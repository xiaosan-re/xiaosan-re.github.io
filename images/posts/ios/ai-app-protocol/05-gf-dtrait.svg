<svg viewBox="0 0 840 392" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g_a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="g_d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/></marker>
    <style>
      .box{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .srv{fill:#e5e7eb;stroke:#64748b;stroke-width:1.5}
      .col{fill:#ecfeff;stroke:#0891b2;stroke-width:1.5}
      .nest{fill:none;stroke:#f59e0b;stroke-width:1.5}
      .nest2{fill:none;stroke:#d97706;stroke-width:1.3}
      .inner{fill:#fde68a;stroke:#d97706;stroke-width:1.4}
      .t{font-size:12.5px;fill:#1e293b;text-anchor:middle}
      .ts{font-size:11px;fill:#475569;text-anchor:middle}
      .tl{font-size:11px;fill:#b45309;font-weight:700}
      .e{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#g_a)}
      .d{stroke:#0284c7;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#g_d)}
      .el{font-size:11px;fill:#0369a1}
      .h{font-size:13px;font-weight:700;fill:#0e7490;text-anchor:middle}
    </style>
  </defs>

  <!-- 请求 / 下发 -->
  <g><rect class="box" x="20" y="24" width="130" height="42" rx="7"/><text class="t" x="85" y="50">客户端</text></g>
  <g><rect class="srv" x="690" y="24" width="130" height="42" rx="7"/><text class="t" x="755" y="50">服务器</text></g>
  <path class="e" d="M150,40 L688,40"/>
  <text class="el" x="420" y="34" text-anchor="middle">POST stats_collect?fetch_config=true</text>
  <path class="d" d="M688,56 L152,56"/>
  <text class="el" x="420" y="74" text-anchor="middle">下发配置：采哪些文件路径 + dtrait RSA 公钥</text>

  <!-- 按配置采集 -->
  <g><rect class="col" x="20" y="92" width="392" height="128" rx="9"/>
     <text class="h" x="216" y="114">按配置采集　collectDxx:path:</text>
     <text class="ts" x="216" y="138" text-anchor="middle">d_c0 / d_o0 / d_o1　= Carrier Bundles 等系统文件时间戳</text>
     <text class="ts" x="216" y="158" text-anchor="middle">d_b0 = 系统启动时间　·　d_m1 = SDK 首启时戳</text>
     <text class="ts" x="216" y="178" text-anchor="middle">d_r2 = App Store 收据（PKCS#7，Apple WWDR 签）</text>
     <text class="ts" x="216" y="202" text-anchor="middle" fill="#0e7490" font-weight="700">真实文件时间戳 + Apple 签名收据 → 难伪造</text>
  </g>

  <!-- 三层套娃 -->
  <text class="h" x="620" y="108" fill="#b45309">三层套娃编码</text>
  <g><rect class="nest"  x="448" y="118" width="370" height="118" rx="9"/><text class="tl" x="458" y="134">TTEncrypt（AES-128-CBC）</text>
     <rect class="nest"  x="466" y="142" width="334" height="84"  rx="7"/><text class="tl" x="476" y="157">gzip</text>
     <rect class="nest2" x="484" y="164" width="298" height="54"  rx="6"/><text class="tl" x="494" y="178">base64</text>
     <rect class="inner" x="502" y="184" width="262" height="28"  rx="5"/><text class="t" x="633" y="203" font-size="11.5">bd_pack（AES-256）= 设备数据</text>
  </g>
  <path class="e" d="M412,156 L446,168"/>
  <text class="el" x="430" y="150" text-anchor="middle">组装</text>
  <path class="e" d="M700,118 C 720,96 740,74 754,68"/>
  <text class="el" x="742" y="104" text-anchor="middle">上报</text>
</svg>
