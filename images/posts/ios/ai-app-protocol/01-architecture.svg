<svg viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/></marker>
    <style>
      .box{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .crypto{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}
      .srv{fill:#e5e7eb;stroke:#64748b;stroke-width:1.5}
      .out{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
      .t{font-size:12.5px;fill:#1e293b;text-anchor:middle}
      .ts{font-size:11px;fill:#475569;text-anchor:middle}
      .lbl{font-size:13px;font-weight:700;fill:#3730a3}
      .edge{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#ar)}
      .dash{stroke:#0284c7;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ard)}
      .elbl{font-size:11px;fill:#0369a1}
    </style>
  </defs>

  <!-- ① 注册 -->
  <text class="lbl" x="14" y="28">① 设备注册 device_register　（服务端不验签名）</text>
  <g><rect class="box" x="14" y="44" width="120" height="44" rx="7"/><text class="t" x="74" y="62">采集设备指纹</text><text class="ts" x="74" y="78">IDFV·cdid·sysctl</text></g>
  <g><rect class="box" x="152" y="44" width="98" height="44" rx="7"/><text class="t" x="201" y="62">组合 JSON</text><text class="ts" x="201" y="78">magic_tag+header</text></g>
  <g><rect class="box" x="268" y="44" width="58" height="44" rx="7"/><text class="t" x="297" y="70">gzip</text></g>
  <g><rect class="crypto" x="344" y="44" width="120" height="44" rx="7"/><text class="t" x="404" y="62">TTEncrypt</text><text class="ts" x="404" y="78">AES-128-CBC</text></g>
  <g><rect class="box" x="482" y="44" width="62" height="44" rx="7"/><text class="t" x="513" y="70">POST</text></g>
  <path class="edge" d="M134,66 L150,66"/>
  <path class="edge" d="M250,66 L266,66"/>
  <path class="edge" d="M326,66 L342,66"/>
  <path class="edge" d="M464,66 L480,66"/>
  <path class="edge" d="M544,66 L596,80"/>

  <!-- 服务器 -->
  <g><rect class="srv" x="600" y="44" width="150" height="226" rx="9"/><text class="t" x="675" y="150" font-size="15" font-weight="700">服务器</text></g>

  <!-- ② 对话 -->
  <text class="lbl" x="14" y="210">② AI 对话 chat/completion　（验签名）</text>
  <g><rect class="box" x="14" y="226" width="92" height="44" rx="7"/><text class="t" x="60" y="244">main</text><text class="ts" x="60" y="260">拿主会话</text></g>
  <g><rect class="box" x="120" y="226" width="96" height="44" rx="7"/><text class="t" x="168" y="244">in_out</text><text class="ts" x="168" y="260">进会话</text></g>
  <g><rect class="box" x="230" y="226" width="104" height="44" rx="7"/><text class="t" x="282" y="244">chat body</text><text class="ts" x="282" y="260">明文 JSON</text></g>
  <g><rect class="crypto" x="348" y="226" width="148" height="44" rx="7"/><text class="t" x="422" y="244">模拟执行签名</text><text class="ts" x="422" y="260">X-Gorgon…</text></g>
  <g><rect class="box" x="510" y="226" width="62" height="44" rx="7"/><text class="t" x="541" y="252">POST</text></g>
  <path class="edge" d="M106,248 L118,248"/>
  <path class="edge" d="M216,248 L228,248"/>
  <path class="edge" d="M334,248 L346,248"/>
  <path class="edge" d="M496,248 L508,248"/>
  <path class="edge" d="M572,248 L596,240"/>

  <!-- 服务器响应（虚线） -->
  <path class="dash" d="M600,120 C 420,118 220,150 64,224"/>
  <text class="elbl" x="300" y="140">下发 device_id / install_id / cookie</text>
  <path class="dash" d="M676,270 L676,294"/>
  <g><rect class="out" x="600" y="296" width="150" height="30" rx="7"/><text class="t" x="675" y="316">SSE 流式 → AI 文本</text></g>
</svg>
