<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1086" viewBox="0 0 1560 1086" role="img" aria-labelledby="title desc">
<title id="title">Android SO：保护前后实测对照</title>
<desc id="desc">六组实际配对观测值。每格上行为未保护、下行为保护版本。AI 重建正确率与原始二进制运行时等价性分开统计。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .metric{font-size:22px;font-variant-numeric:tabular-nums}.small{font-size:18px}</style>
<rect width="1560" height="1086" fill="#ffffff"/>
<text x="40" y="48" font-size="31" fill="#172b4d" text-anchor="start" font-weight="600">Android SO：保护前后实测对照</text>
<text x="40" y="82" font-size="19" fill="#475569" text-anchor="start" font-weight="normal">3 组新秘密 × 静态／动态两轨；同一个函数族，不是 6 个不同 App；有效配对 5/6</text>
<text x="40" y="118" font-size="18" fill="#64748b" text-anchor="start" font-weight="normal">每格上行：未保护</text>
<text x="295" y="118" font-size="18" fill="#245ca4" text-anchor="start" font-weight="normal">下行：虚拟化保护</text>
<text x="1520" y="118" font-size="18" fill="#475569" text-anchor="end" font-weight="normal">gpt-5.6-sol · high</text>
