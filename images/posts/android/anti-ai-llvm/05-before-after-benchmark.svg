<text x="40" y="828" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">tokens 为 CLI 累计 input_tokens + output_tokens；input 已含 cached，不再加 cached 或 reasoning 字段。</text>
<text x="40" y="857" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">未缓存输入单列；token 倍数 = 虚拟化保护 累计 tokens ÷ 未保护 累计 tokens；缺失统计显示 N/A。</text>
<text x="40" y="886" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">运行时等价性是原始未保护／保护 SO 的预检，不是 AI 重建正确率；会话时长也不是首次恢复时间。</text>
<text x="40" y="915" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">实际美元费用：N/A（订阅认证未提供逐轮账单）；额外 6 轮未保护控制不混入主 18 轮成功率。</text>
<text x="40" y="944" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">* 轨道违规行保留原始得分与消耗，仅作越轨证据；不计有效静态恢复率或配对 token 倍数。</text>
<text x="40" y="973" font-size="18" fill="#475569" text-anchor="start" font-weight="normal">秘密 0 / S_static：静态轨实际执行目标 VM 程序，排除比较</text>
<text x="40" y="1010" font-size="16" fill="#64748b" text-anchor="start" font-weight="normal">同秘密、同轨道配对；18 次方案对照 + 6 次未保护基线；2026-10-30</text>
</svg>
